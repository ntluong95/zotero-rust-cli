# cargo-about config. Only permissive licenses compatible with binary
# redistribution are accepted; a new copyleft/unknown license in the
# dependency tree fails the release build instead of shipping silently.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    # Data-only license used by webpki-roots for bundled Mozilla CA certificate
    # data, not executable code.
    "CDLA-Permissive-2.0",
    # File-level weak copyleft (option-ext, via dirs-sys). Safe for binary
    # redistribution of an unmodified upstream dependency: only requires
    # preserving the license text/attribution for that file, not relicensing
    # the whole binary, which cargo-about's bundle already satisfies.
    "MPL-2.0",
]
