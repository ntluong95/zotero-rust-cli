[workspace]
resolver = "2"
members = ["crates/zotero-cli"]

[workspace.package]
version = "1.0.0-rc.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ntluong95/zotero-rust-cli"
description = "Native Rust port of cli-anything-zotero: a standalone CLI for AI agents to work with Zotero libraries."

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
