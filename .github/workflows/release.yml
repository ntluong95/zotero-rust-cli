name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    # Least privilege: this job only compiles third-party crates and
    # packages archives. Release-writing / attestation permissions belong
    # only to `publish`, which is the job that actually needs them.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
          # Native Intel build, kept intentionally (see the matching note
          # in ci.yml). GitHub has announced Intel-hosted runner
          # discontinuation after August 2027, at which point this needs
          # to switch to cross-compiling from a macos-14 (ARM) runner.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      # Pinned explicitly to match rust-toolchain.toml — see the same note
      # in ci.yml. @stable would silently drift from the repo's pin.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Generate third-party license bundle
        shell: bash
        run: bash packaging/generate-third-party-licenses.sh THIRD-PARTY-LICENSES.md

      - name: Build (release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      # Ad-hoc signing (no paid Apple Developer account): satisfies the
      # arm64 "must be signed to run" requirement, but does NOT clear
      # Gatekeeper quarantine on downloaded files. Homebrew is the
      # documented primary macOS channel; docs/INSTALL.md carries the
      # `xattr -d com.apple.quarantine` fallback for direct downloads.
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - --timestamp=none "target/${{ matrix.target }}/release/zotero-cli"
          codesign --force --sign - --timestamp=none "target/${{ matrix.target }}/release/cli-anything-zotero"

      - name: Stage archive contents
        shell: bash
        run: |
          set -euo pipefail
          stage="stage/zotero-cli-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$stage"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/zotero-cli$ext" "$stage/"
          cp "target/${{ matrix.target }}/release/cli-anything-zotero$ext" "$stage/"
          cp LICENSE "$stage/"
          cp NOTICE-CHANGES.md "$stage/"
          cp THIRD-PARTY-LICENSES.md "$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          out="zotero-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -C stage -czf "$out" "$(basename "$STAGE")"
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"

      # PowerShell's Compress-Archive ships with every windows-latest
      # runner; 7-Zip's availability under `shell: bash` (Git Bash) is not
      # reliable and has been removed from some runner images entirely.
      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stageName = "zotero-cli-${{ github.ref_name }}-${{ matrix.target }}"
          $out = "zotero-cli-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive -Path "stage/$stageName" -DestinationPath $out
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$out"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Create stable installer aliases
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin.tar.gz x86_64-apple-darwin.tar.gz x86_64-unknown-linux-gnu.tar.gz aarch64-unknown-linux-gnu.tar.gz x86_64-pc-windows-msvc.zip; do
            src=$(ls zotero-cli-*"-${target}" 2>/dev/null | head -n 1 || true)
            if [ -n "$src" ] && [ -f "$src" ]; then
              cp "$src" "zotero-cli-${target}"
              echo "Created stable alias: zotero-cli-${target} from $src"
            fi
          done

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # Free, keyless signing via GitHub's Sigstore-backed attestation
      # service. No paid signing credentials required. Verify with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
