name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Pinned explicitly (not @stable) so this matches rust-toolchain.toml
      # exactly: dtolnay/rust-toolchain does not read that file itself, so
      # relying on @stable here would silently drift from the repo's pin.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Verify binaries run
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          "$bin_dir/zotero-cli$ext"
          "$bin_dir/cli-anything-zotero$ext"

      - name: Enforce binary size budget (under 15 MB)
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          bin="$bin_dir/zotero-cli$ext"
          size=$(wc -c < "$bin")
          limit=$((15 * 1024 * 1024))
          echo "zotero-cli$ext: $size bytes (limit $limit)"
          if [[ "$size" -gt "$limit" ]]; then
            echo "::error::binary exceeds the 15 MB budget"
            exit 1
          fi

      - name: Check for unexpected dynamic dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/zotero-cli"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            otool -L "$bin"
            unexpected=$(otool -L "$bin" | tail -n +2 | grep -v -E '/usr/lib/libSystem' || true)
          else
            ldd "$bin"
            unexpected=$(ldd "$bin" | grep -v -E 'linux-vdso|ld-linux|libc\.so|libm\.so|libpthread\.so|libdl\.so|libgcc_s\.so' || true)
          fi
          if [[ -n "$unexpected" ]]; then
            echo "::error::unexpected dynamic dependency:"
            echo "$unexpected"
            exit 1
          fi
