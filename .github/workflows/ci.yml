name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          # macos-13 (the last standard Intel runner image) has been
          # phased down in favor of Apple Silicon; macos-15-intel is
          # GitHub's dedicated Intel-hosted label. GitHub has announced
          # Intel-hosted runners will be discontinued after August 2027 —
          # see the "x86_64-apple-darwin (cross, informational)" job below
          # for the ARM->x86_64 cross-compilation fallback this forces us
          # onto eventually.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # Pinned explicitly (not @stable) so this matches rust-toolchain.toml
      # exactly: dtolnay/rust-toolchain does not read that file itself, so
      # relying on @stable here would silently drift from the repo's pin.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Build (release)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --workspace --release --target ${{ matrix.target }}

      - name: Verify binaries run
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          "$bin_dir/zotero-cli$ext"
          "$bin_dir/cli-anything-zotero$ext"

      - name: Enforce binary size budget (under 15 MB)
        shell: bash
        run: |
          set -euo pipefail
          bin_dir="target/${{ matrix.target }}/release"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          bin="$bin_dir/zotero-cli$ext"
          size=$(wc -c < "$bin")
          limit=$((15 * 1024 * 1024))
          echo "zotero-cli$ext: $size bytes (limit $limit)"
          if [[ "$size" -gt "$limit" ]]; then
            echo "::error::binary exceeds the 15 MB budget"
            exit 1
          fi

      - name: Check for unexpected dynamic dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/zotero-cli"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            otool -L "$bin"
            # libiconv ships with every macOS install (like libSystem) and
            # gets linked transitively by several crates (e.g. regex's
            # locale-aware dependency chain) — not an install-cost concern.
            unexpected=$(otool -L "$bin" | tail -n +2 | grep -v -E '/usr/lib/libSystem|/usr/lib/libiconv' || true)
          else
            ldd "$bin"
            unexpected=$(ldd "$bin" | grep -v -E 'linux-vdso|ld-linux|libc\.so|libm\.so|libpthread\.so|libdl\.so|libgcc_s\.so' || true)
          fi
          if [[ -n "$unexpected" ]]; then
            echo "::error::unexpected dynamic dependency:"
            echo "$unexpected"
            exit 1
          fi

  # Informational only: proves ARM64->x86_64 cross-compilation works as a
  # fallback for the day Intel-hosted macOS runners are discontinued
  # (GitHub has announced this for after August 2027). Not part of the
  # release matrix today — x86_64-apple-darwin release artifacts are still
  # built natively on macos-15-intel above. continue-on-error so a
  # regression here doesn't block CI before it's actually load-bearing.
  cross-compile-validation:
    name: x86_64-apple-darwin (cross, informational)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-x86_64-apple-darwin

      - name: Cross-build for x86_64-apple-darwin from arm64 host
        run: cargo build --workspace --release --target x86_64-apple-darwin

      - name: Install Rosetta (to execute the cross-built x86_64 binary)
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Verify cross-built binary runs (Rosetta)
        run: ./target/x86_64-apple-darwin/release/zotero-cli
