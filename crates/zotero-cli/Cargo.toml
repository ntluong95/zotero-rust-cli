[package]
name = "zotero-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "zotero_cli"
path = "src/lib.rs"

[[bin]]
name = "zotero-cli"
path = "src/main.rs"

[[bin]]
name = "cli-anything-zotero"
path = "src/bin/cli_anything_zotero.rs"

[dependencies]
# Added early per Phase 2: these two are the most likely to break
# cross-compilation across the 5 release targets, so that surfaces now
# rather than at Phase 4/5 when hundreds of call sites depend on them.
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3", features = ["json"] }
# Runtime foundation (Phase 3+): CLI parsing, JSON contracts matching
# Python's json.dumps(..., indent=2) key order exactly, error handling,
# and cross-platform home-dir resolution for path discovery / session
# state, matching the reference implementation's Path.home() usage.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
dirs = "6"
# note_html_to_text/note_preview (Python core: html.unescape + regex tag
# stripping) — item get/list/find always populate these two fields.
regex = "1"
html-escape = "0.2"
sha2 = "0.10"
# style list (core/catalog.py's list_styles): a real namespace-aware
# parse of *.csl files, matching Python's ElementTree.iter() walk —
# also the parser this project will need for Phase 9/12's DOCX OOXML
# work, so bringing it in now rather than a regex-based CSL heuristic.
quick-xml = "0.42"
# session::save_session_state's cross-platform advisory lock, matching
# Python's best-effort fcntl.flock (session.py: silently continues when
# unavailable, e.g. on Windows). A small, focused crate rather than the
# broader fs2, per the project's small-dependency-footprint principle.
fd-lock = "4"
# Native ZIP/OOXML handling for Phase 9 DOCX commands.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
# credentials.rs's atomic credential-file replacement: std::fs::rename's exact Windows
# replace-existing semantics are OS-version-dependent (MoveFileExW with a
# SetFileInformationByHandle fallback -- see std docs), so the write-capable API key store calls
# MoveFileExW with MOVEFILE_REPLACE_EXISTING explicitly rather than relying on that. Already a
# transitive dependency via other crates' Windows backends (rustls/ring, errno), so this adds no
# new weight to the dependency graph -- only a narrow feature slice for the one FFI call used.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
